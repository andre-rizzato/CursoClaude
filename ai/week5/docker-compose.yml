# Semana 5 — Ollama local via docker-compose
#
# Não toca no DistributedOrderSystem (repo separado) — isso é só o
# runtime do LLM local, usado pela camada de IA (Python) em ai/.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-ai-engineer
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Docker não repassa GPU pra nenhum container por padrão — sem isso
    # aqui, o Ollama roda em CPU mesmo com uma GPU disponível no host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama_data:
